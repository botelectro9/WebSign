<!doctype html>
<html lang="{{LANG}}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="{{CSP}}">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="dark">
<meta name="theme-color" content="#0f241b">
<meta name="description" content="{{DESCRIPTION}}">
<title>{{TITLE}}</title>
<link rel="icon" href="{{FAVICON}}">
{{VISION_HEAD}}
<style>
/* @CSS */
</style>
</head>
<body>
<!-- @ICONS -->

<!-- ===================================================================== app -->
<div id="view-app" class="app">
  <header class="bar topbar" id="topbar">
    <a class="brand-link" href="../index.html" id="app-home" data-i18n-aria="nav.home"><svg class="logo" aria-hidden="true"><use href="#i-logo"/></svg><span>WebSign</span></a>
    <span class="filename" id="filename"></span>
    <span class="spacer"></span>
    <a class="bar-link" id="app-help" href="../doc/doc_{{LANG}}.html" data-i18n="nav.help"></a>
  </header>

  <main id="viewer" class="viewer" data-i18n-aria="doc.aria">
    <section id="start" class="start">
      <div class="dropzone" id="dropzone">
        <svg class="hero ico" aria-hidden="true"><use href="#i-file"/></svg>
        <h1 data-i18n="start.title"></h1>
        <p class="lead" data-i18n="start.lead"></p>
        <button type="button" class="btn primary" id="open-btn" data-i18n="start.open"></button>
        <p class="hint" data-i18n="start.drop"></p>
        <input type="file" id="file-input" accept="application/pdf,.pdf,image/*" hidden>
      </div>
      <p class="privacy" data-i18n="start.privacy"></p>
    </section>
    <div id="pages" class="pages"></div>
  </main>

  <div id="drop-overlay" class="drop-overlay" hidden><div data-i18n="drop.overlay"></div></div>

  <nav id="toolbar" class="toolbar" role="toolbar" data-i18n-aria="tb.label" hidden>
    <button type="button" class="tb" id="tb-box" aria-haspopup="menu" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-box"/></svg></button>
    <button type="button" class="tb" id="tb-pen" data-i18n-tip="tb.penTip" aria-haspopup="true" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-pen"/></svg><span class="pen-dot" id="pen-dot"></span></button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="tb" id="tb-undo" data-i18n-aria="tb.undo" data-i18n-tip="tb.undoTip" disabled><svg class="ico" aria-hidden="true"><use href="#i-undo"/></svg></button>
    <button type="button" class="tb" id="tb-redo" data-i18n-aria="tb.redo" data-i18n-tip="tb.redoTip" disabled><svg class="ico" aria-hidden="true"><use href="#i-redo"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="tb" id="tb-sig" data-i18n-aria="tb.sig" data-i18n-tip="tb.sigTip" disabled><svg class="ico" aria-hidden="true"><use href="#i-sig"/></svg></button>
    <button type="button" class="tb" id="tb-save" data-i18n-aria="tb.save" data-i18n-tip="tb.saveTip" disabled><svg class="ico" aria-hidden="true"><use href="#i-doc"/></svg></button>
    <span class="sep" aria-hidden="true"></span>
    <button type="button" class="tb" id="tb-vision" data-i18n-aria="tb.vision" data-i18n-tip="tb.visionTip" aria-haspopup="menu" aria-expanded="false"><svg class="ico" aria-hidden="true"><use href="#i-eye"/></svg></button>
  </nav>

  <div id="box-menu" class="popover menu" role="menu" data-i18n-aria="menu.label" hidden>
    <button type="button" role="menuitem" id="bm-erase"><svg class="ico" aria-hidden="true"><use href="#i-eraser"/></svg><span data-i18n="menu.erase"></span></button>
    <button type="button" role="menuitem" id="bm-delete" class="danger"><svg class="ico" aria-hidden="true"><use href="#i-trash"/></svg><span data-i18n="menu.delete"></span></button>
    <button type="button" role="menuitem" id="bm-cancel"><svg class="ico" aria-hidden="true"><use href="#i-x"/></svg><span data-i18n="menu.cancel"></span></button>
  </div>

  <div id="vision-menu" class="popover menu vision-menu" role="menu" data-i18n-aria="vision.label" hidden>
    <button type="button" role="menuitemradio" data-vision="normal"><span class="radio" aria-hidden="true"></span><span data-i18n="vision.normal"></span></button>
    <button type="button" role="menuitemradio" data-vision="protan"><span class="radio" aria-hidden="true"></span><span data-i18n="vision.protan"></span></button>
    <button type="button" role="menuitemradio" data-vision="deutan"><span class="radio" aria-hidden="true"></span><span data-i18n="vision.deutan"></span></button>
    <button type="button" role="menuitemradio" data-vision="tritan"><span class="radio" aria-hidden="true"></span><span data-i18n="vision.tritan"></span></button>
  </div>

  <div id="pen-pop" class="popover swatches" role="radiogroup" data-i18n-aria="pen.label" hidden></div>
</div>

<dialog id="save-dlg" class="dlg" aria-labelledby="save-title">
  <form method="dialog" id="save-form">
    <h2 id="save-title" data-i18n="save.title"></h2>
    <fieldset class="formats">
      <legend data-i18n="save.format"></legend>
      <label><input type="radio" name="fmt" value="pdf" checked><span>PDF</span></label>
      <label><input type="radio" name="fmt" value="png"><span>PNG</span></label>
      <label><input type="radio" name="fmt" value="jpg"><span>JPG</span></label>
    </fieldset>
    <p class="note" id="save-note"></p>
    <label class="check"><input type="checkbox" name="outline" id="save-outline"><span data-i18n="save.outline"></span></label>
    <div class="actions save-actions">
      <button type="button" class="btn" id="save-cancel" data-i18n="save.cancel"></button>
      <button type="button" class="btn" id="save-share" hidden aria-describedby="save-reason" data-i18n="save.share"></button>
      <button type="button" class="btn" id="save-copy" data-i18n="save.copy"></button>
      <button type="button" class="btn primary" id="save-overwrite" aria-describedby="save-reason" data-i18n="save.overwrite"></button>
    </div>
    <p class="reason" id="save-reason"></p>
  </form>
</dialog>

<dialog id="pwd-dlg" class="dlg" aria-labelledby="pwd-title">
  <form method="dialog" id="pwd-form">
    <h2 id="pwd-title" data-i18n="pwd.title"></h2>
    <p class="note" id="pwd-note"></p>
    <input type="password" id="pwd-input" class="field" autocomplete="off" data-i18n-aria="pwd.input">
    <!-- "Open" comes first in the DOM so that Enter (implicit submission) opens; shown on the right -->
    <div class="actions reverse">
      <button type="submit" class="btn primary" value="ok" data-i18n="pwd.open"></button>
      <button type="submit" class="btn" id="pwd-cancel" value="cancel" data-i18n="pwd.cancel"></button>
    </div>
  </form>
</dialog>

<dialog id="confirm-dlg" class="dlg" aria-labelledby="confirm-title">
  <form method="dialog">
    <h2 id="confirm-title" data-i18n="confirm.title"></h2>
    <p class="note" id="confirm-note"></p>
    <div class="actions">
      <button type="submit" class="btn" value="cancel" data-i18n="confirm.cancel"></button>
      <button type="submit" class="btn primary" value="ok" id="confirm-ok" data-i18n="confirm.ok"></button>
    </div>
  </form>
</dialog>

<!-- Shown when the browser cannot open a "Save as" picker and the download could not be
     started directly (no user activation left after a slow export, e.g. Safari/iOS).
     A real link clicked by the user is the most reliable way to download everywhere. -->
<dialog id="ready-dlg" class="dlg compact" aria-labelledby="ready-title">
  <form method="dialog">
    <h2 id="ready-title" data-i18n="ready.title"></h2>
    <label class="name-field" for="ready-name" data-i18n="ready.name"></label>
    <div class="name-row">
      <input id="ready-name" class="field" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" enterkeyhint="done">
      <span id="ready-ext" class="ext"></span>
    </div>
    <p class="note" id="ready-hint" hidden data-i18n="ready.webviewHint"></p>
    <figure class="preview" id="ready-preview" hidden>
      <img id="ready-img" alt="">
      <figcaption data-i18n="ready.longPress"></figcaption>
    </figure>
    <div class="actions">
      <button type="submit" class="btn" value="cancel" data-i18n="ready.close"></button>
      <button type="button" class="btn" id="ready-share" hidden data-i18n="ready.share"></button>
      <a class="btn primary" id="ready-link" href="#" data-i18n="ready.save"></a>
    </div>
  </form>
</dialog>

<div id="busy" class="busy" hidden><div class="spinner" aria-hidden="true"></div><span id="busy-text"></span></div>
<div id="toast" class="toast" role="status" aria-live="polite"></div>

<!-- @LIBS -->
<script>
/* @JS */
</script>
</body>
</html>
