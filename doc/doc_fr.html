<title>WebSign – Guide d’utilisation</title>

<style>
:root {
  --bg: #e8eaee;
  --surface: #ffffff;
  --surface-2: #f3f4f6;
  --text: #1c1f24;
  --muted: #5d6470;
  --line: rgba(20, 24, 31, 0.12);
  --accent: #2f5bea;
  --accent-text: #ffffff;
  --danger: #c62828;
  --shadow: 0 10px 30px rgba(15, 20, 30, 0.18), 0 2px 6px rgba(15, 20, 30, 0.1);
  --page-shadow: 0 1px 3px rgba(15, 20, 30, 0.18), 0 6px 18px rgba(15, 20, 30, 0.08);
  --radius: 14px;
  --tb-size: 44px;
  --safe-b: env(safe-area-inset-bottom, 0px);
  --safe-t: env(safe-area-inset-top, 0px);
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #17191d;
    --surface: #262a31;
    --surface-2: #2f343c;
    --text: #eceef2;
    --muted: #a4abb7;
    --line: rgba(255, 255, 255, 0.12);
    --accent: #6d8dff;
    --accent-text: #0d1330;
    --danger: #ff6b6b;
    --shadow: 0 10px 30px rgba(0, 0, 0, 0.5), 0 2px 6px rgba(0, 0, 0, 0.35);
    --page-shadow: 0 1px 3px rgba(0, 0, 0, 0.5), 0 6px 18px rgba(0, 0, 0, 0.3);
  }
}

* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
}
[hidden] { display: none !important; }
button { font: inherit; color: inherit; }
.ico {
  width: 22px; height: 22px; flex: none;
  fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
}

/* ---------- shared header bar ---------- */
.bar {
  position: sticky; top: 0; z-index: 20;
  display: flex; align-items: center; gap: 12px;
  min-height: 52px;
  padding: calc(8px + var(--safe-t)) max(16px, env(safe-area-inset-right)) 8px max(16px, env(safe-area-inset-left));
  background: color-mix(in srgb, var(--bg) 82%, transparent);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
  font-size: 14px; color: var(--muted);
}
.brand-link {
  display: inline-flex; align-items: center; gap: 8px; flex: none;
  color: var(--text); text-decoration: none; font-weight: 650; letter-spacing: -0.01em;
  border-radius: 8px;
}
.brand-link .logo { width: 24px; height: 24px; color: var(--accent); }
.spacer { flex: 1; }
.bar-link { color: var(--muted); text-decoration: none; padding: 6px 8px; border-radius: 8px; white-space: nowrap; }
.bar-link:hover { color: var(--text); background: var(--surface-2); }
a:focus-visible { outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px; }
.filename { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }

.btn {
  min-height: 44px; padding: 0 20px; border-radius: 12px;
  border: 1px solid var(--line); background: var(--surface-2);
  cursor: pointer; font-weight: 550;
}
.btn:hover { filter: brightness(0.97); }
.btn.primary { background: var(--accent); color: var(--accent-text); border-color: transparent; }
.btn:focus-visible, .tb:focus-visible, .menu button:focus-visible, .swatch:focus-visible {
  outline: 3px solid color-mix(in srgb, var(--accent) 60%, transparent); outline-offset: 2px;
}

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; line-height: 1.2; }
.btn.small { min-height: 36px; padding: 0 14px; border-radius: 10px; font-size: 14px; }
/* ---------- landing ---------- */
.landing-main {
  min-height: 100vh; min-height: 100dvh;
  max-width: 860px; margin: 0 auto;
  padding: calc(48px + var(--safe-t)) 20px calc(40px + var(--safe-b));
  display: flex; flex-direction: column; align-items: center; text-align: center;
}
.landing-brand { display: flex; align-items: center; gap: 14px; }
.landing-brand h1 { margin: 0; font-size: clamp(34px, 7vw, 48px); letter-spacing: -0.03em; }
.logo-lg { width: 56px; height: 56px; color: var(--accent); }
.pitch { margin: 14px 0 0; font-size: clamp(17px, 3.4vw, 20px); color: var(--muted); max-width: 40em; }
.pitch span { display: block; }
.pitch [lang="fr"] { margin-top: 2px; font-size: 0.92em; }
.privacy-card {
  margin: 28px 0 8px; padding: 14px 18px;
  display: flex; gap: 12px; align-items: flex-start; text-align: left;
  background: color-mix(in srgb, #1f9d55 10%, var(--surface));
  border: 1px solid color-mix(in srgb, #1f9d55 35%, var(--line));
  border-radius: 14px; max-width: 640px;
}
.privacy-card .ico { color: #1f9d55; margin-top: 2px; }
.privacy-card p { margin: 0; font-size: 14.5px; }
.privacy-card p + p { margin-top: 6px; color: var(--muted); }
.choices { margin-top: 28px; width: 100%; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
@media (max-width: 620px) { .choices { grid-template-columns: 1fr; } }
.choice {
  display: flex; flex-direction: column; gap: 10px;
  padding: 20px; text-align: left;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--page-shadow);
}
.choice h2 { margin: 0 0 4px; font-size: 15px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; }
.btn.big { min-height: 52px; justify-content: flex-start; padding: 0 18px; font-size: 16px; }
.landing-foot { margin-top: 32px; font-size: 13px; color: var(--muted); }
.landing-foot span { display: block; }
.landing-foot a { color: inherit; }

/* ---------- docs ---------- */
.docs-body { max-width: 1120px; margin: 0 auto; padding: 24px 20px calc(64px + var(--safe-b)); display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 40px; }
@media (max-width: 860px) { .docs-body { grid-template-columns: 1fr; gap: 8px; } }
.toc { position: sticky; top: 72px; align-self: start; max-height: calc(100vh - 90px); overflow: auto; font-size: 14px; }
@media (max-width: 860px) { .toc { position: static; max-height: none; } }
.toc h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); margin: 0 0 8px; }
.toc ol { margin: 0; padding-left: 20px; }
.toc li { margin: 4px 0; }
.toc a { color: var(--text); text-decoration: none; }
.toc a:hover { color: var(--accent); text-decoration: underline; }
.doc { max-width: 720px; font-size: 16px; line-height: 1.65; }
.doc h1 { font-size: clamp(28px, 5vw, 36px); letter-spacing: -0.02em; margin: 0 0 8px; line-height: 1.2; }
.doc .lede { font-size: 18px; color: var(--muted); margin-top: 0; }
.doc h2 { font-size: 22px; margin: 40px 0 10px; padding-top: 8px; border-top: 1px solid var(--line); scroll-margin-top: 70px; }
.doc h3 { font-size: 17px; margin: 22px 0 6px; scroll-margin-top: 70px; }
.doc a { color: var(--accent); }
.doc code, .doc kbd {
  font: 0.88em ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 5px; padding: 1px 5px;
}
.doc table { border-collapse: collapse; width: 100%; font-size: 15px; margin: 12px 0; }
.doc th, .doc td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.doc th { color: var(--muted); font-weight: 600; }
.doc .callout { padding: 12px 16px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 9%, var(--surface)); border: 1px solid color-mix(in srgb, var(--accent) 25%, var(--line)); }
.doc .tbicon { display: inline-flex; vertical-align: -5px; width: 26px; height: 26px; align-items: center; justify-content: center; border-radius: 50%; background: var(--surface); border: 1px solid var(--line); margin: 0 2px; }
.doc .tbicon .ico { width: 16px; height: 16px; }
.doc dt { font-weight: 650; margin-top: 14px; }
.doc dd { margin: 4px 0 0 0; }
.doc-foot { margin-top: 48px; padding-top: 16px; border-top: 1px solid var(--line); font-size: 14px; color: var(--muted); display: flex; gap: 16px; flex-wrap: wrap; }
</style>
</head>
